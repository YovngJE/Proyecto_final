<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pronóstico de consumo eléctrico</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#14213d;--muted:#5d6b82;--line:#d9e0ea;--hist:#2457c5;--pred:#e08a00;--band:rgba(224,138,0,.18);--bad:#b3261e;--ok:#1f7a4d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:1040px;margin:0 auto;padding:28px 16px 56px}
h1{font-size:1.7rem;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:4px 0 22px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.controls{display:flex;flex-wrap:wrap;gap:18px 24px;align-items:flex-end;margin-bottom:16px}
.controls label,.controls .lbl{display:block;font-size:.85rem;color:var(--muted);margin-bottom:6px}
.seg{display:flex}
.seg button{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;font:inherit;cursor:pointer;margin-left:-1px}
.seg button:first-child{border-radius:8px 0 0 8px;margin-left:0}
.seg button:last-child{border-radius:0 8px 8px 0}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;position:relative}
select,.refresh{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.refresh{cursor:pointer;background:var(--hist);border-color:var(--hist);color:#fff}
button:focus-visible,select:focus-visible{outline:3px solid #8fb2ff;outline-offset:2px}
button:disabled,select:disabled{opacity:.55;cursor:wait}
.hero{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi small{display:block;color:var(--muted);font-size:.85rem}
.kpi b{display:block;font-size:1.45rem;font-variant-numeric:tabular-nums;margin:2px 0}
.kpi span{font-size:.85rem;color:var(--muted)}
.kpi.main{border-color:var(--pred);border-width:2px}
.kpi.main b{font-size:2.4rem;line-height:1.1;color:var(--pred)}
.kpi.warn{border-color:var(--bad)}
.kpi.warn span{color:var(--bad);font-weight:600}
.chart{position:relative;height:380px}
.alert{background:#fdecea;border:1px solid #f3b4ae;color:var(--bad);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.alert b{display:block;margin-bottom:2px}
.alert button{margin-top:8px;font:inherit;padding:6px 12px;border-radius:8px;border:1px solid var(--bad);background:#fff;color:var(--bad);cursor:pointer}
.status{color:var(--muted);font-size:.9rem;margin:10px 0 0}
[hidden]{display:none!important}
@media(max-width:760px){.hero{grid-template-columns:1fr 1fr}.kpi.main{grid-column:1/-1}.chart{height:300px}}
</style>
</head>
<body>
<main>
  <h1>Consumo eléctrico: próximas horas</h1>
  <p class="sub">Pronóstico del consumo total del servidor. Todas las horas están en hora de Colombia.</p>

  <div class="panel controls">
    <div>
      <span class="lbl" id="lblHoras">Horas a pronosticar</span>
      <div class="seg" role="group" aria-labelledby="lblHoras" id="horasBtns"></div>
    </div>
    <div>
      <label for="hist">Historia a mostrar</label>
      <select id="hist">
        <option value="24">Últimas 24 h</option>
        <option value="48" selected>Últimas 48 h</option>
        <option value="96">Últimas 96 h</option>
        <option value="168">Últimos 7 días</option>
      </select>
    </div>
    <div>
      <label for="conf">Nivel de confianza</label>
      <select id="conf">
        <option value="0.8">80 %</option>
        <option value="0.9">90 %</option>
        <option value="0.95" selected>95 %</option>
        <option value="0.99">99 %</option>
      </select>
    </div>
    <button class="refresh" id="refresh" type="button">Actualizar</button>
  </div>

  <div class="alert" id="error" role="alert" hidden>
    <b>No pudimos obtener el pronóstico</b>
    <span id="errorMsg"></span><br>
    <button type="button" id="retry">Reintentar</button>
  </div>

  <section class="hero" id="hero" aria-live="polite">
    <div class="kpi main"><small>Próxima hora (<span id="kHoraProx">–</span>)</small><b id="kProx">–</b><span id="kRango">&nbsp;</span></div>
    <div class="kpi"><small>Pico esperado</small><b id="kMax">–</b><span id="kMaxHora">&nbsp;</span></div>
    <div class="kpi"><small>Último dato recibido</small><b id="kUlt" style="font-size:1.1rem">–</b><span id="kUltRel">&nbsp;</span></div>
    <div class="kpi" id="kCal"><small>Calidad de los datos</small><b id="kRell">–</b><span id="kRellTxt">&nbsp;</span></div>
  </section>

  <div class="panel">
    <div class="chart"><canvas id="grafica" role="img" aria-label="Histórico y pronóstico de consumo con intervalo de confianza"></canvas></div>
    <p class="status" id="status">Cargando…</p>
  </div>
</main>

<script>
const TZ = "America/Bogota";
const OPCIONES_HORAS = [6, 12, 24, 48, 72];
let horas = 12;
let grafica = null;
const $ = (id) => document.getElementById(id);

// ---- Formato: siempre hora de Colombia (la API entrega UTC con "Z") ----
const fmtCorta = new Intl.DateTimeFormat("es-CO", { timeZone: TZ, day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
const fmtHora = new Intl.DateTimeFormat("es-CO", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
const fmtLarga = new Intl.DateTimeFormat("es-CO", { timeZone: TZ, weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
const corta = (iso) => fmtCorta.format(new Date(iso)).replace(",", "");
const num = (v) => v.toLocaleString("es-CO", { maximumFractionDigits: 1 });

function textoError(cuerpo, status) {
  const d = cuerpo && cuerpo.detail;
  if (typeof d === "string") return d;
  if (Array.isArray(d)) return d.map((x) => x.msg).join("; ");
  return `La API respondió con el error ${status}.`;
}

function ocupado(si) {
  ["refresh", "hist", "conf"].forEach((id) => ($(id).disabled = si));
  document.querySelectorAll("#horasBtns button").forEach((b) => (b.disabled = si));
  if (si) $("status").textContent = "Cargando…";
}

async function cargar() {
  ocupado(true);
  $("error").hidden = true;
  try {
    const url = `/api/prediccion?horas=${horas}&historia=${$("hist").value}&confianza=${$("conf").value}`;
    const r = await fetch(url);
    const cuerpo = await r.json().catch(() => null);
    if (!r.ok) throw new Error(textoError(cuerpo, r.status));
    pintar(cuerpo);
  } catch (e) {
    $("errorMsg").textContent = e instanceof TypeError
      ? "No hay conexión con la API. Revisa que el servicio esté corriendo."
      : e.message;
    $("error").hidden = false;
    $("status").textContent = "Sin datos para mostrar.";
  } finally {
    ocupado(false);
  }
}

function pintar(d) {
  const hist = d.historico, pred = d.prediccion;
  if (!pred.length) throw new Error("La API no devolvió pronóstico.");

  // Indicadores
  const p0 = pred[0];
  $("kHoraProx").textContent = fmtHora.format(new Date(p0.tiempo));
  $("kProx").textContent = num(p0.prediccion);
  $("kRango").textContent = `Entre ${num(p0.limite_inferior)} y ${num(p0.limite_superior)}`;
  const pico = pred.reduce((a, b) => (b.prediccion > a.prediccion ? b : a));
  $("kMax").textContent = num(pico.prediccion);
  $("kMaxHora").textContent = fmtLarga.format(new Date(pico.tiempo));
  const ult = new Date(d.ultima_observacion);
  $("kUlt").textContent = fmtLarga.format(ult);
  const hace = Math.max(0, Math.round((Date.now() - ult.getTime()) / 3600000));
  $("kUltRel").textContent = hace === 0 ? "Hace menos de 1 h" : `Hace ${hace} h`;
  const rell = d.horas_rellenadas, uso = d.horas_contexto_usadas;
  const malo = uso > 0 && rell / uso > 0.1;
  $("kRell").textContent = `${rell} de ${uso} h`;
  $("kRellTxt").textContent = malo ? "Muchas horas rellenadas: pronóstico menos confiable" : rell === 0 ? "Sin horas rellenadas" : "Horas sin dato rellenadas";
  $("kCal").classList.toggle("warn", malo);

  // Gráfica: histórico + pronóstico (unido al último dato) + banda de confianza
  const nH = hist.length, nP = pred.length;
  const huecoH = (n) => Array(n).fill(null);
  const ultimo = hist[nH - 1].valor;
  const labels = [...hist.map((x) => corta(x.tiempo)), ...pred.map((x) => corta(x.tiempo))];
  const pct = Math.round(d.confianza * 100);
  const serie = (campo) => [...huecoH(nH - 1), ultimo, ...pred.map((x) => x[campo])];
  const datasets = [
    { label: "Histórico", data: [...hist.map((x) => x.valor), ...huecoH(nP)], borderColor: "#2457c5", borderWidth: 2, pointRadius: 0, tension: 0.25 },
    { label: "Pronóstico", data: serie("prediccion"), borderColor: "#e08a00", borderWidth: 2.5, borderDash: [7, 4], pointRadius: 0, tension: 0.25 },
    { label: "límite inferior", data: serie("limite_inferior"), borderWidth: 0, pointRadius: 0, tension: 0.25 },
    { label: `Intervalo de confianza ${pct} %`, data: serie("limite_superior"), borderWidth: 0, pointRadius: 0, tension: 0.25, fill: "-1", backgroundColor: "rgba(224,138,0,.18)" },
  ];
  if (grafica) grafica.destroy();
  grafica = new Chart($("grafica"), {
    type: "line",
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { labels: { filter: (i) => i.text !== "límite inferior", usePointStyle: true } },
        tooltip: { filter: (i) => i.datasetIndex !== 2, callbacks: { label: (c) => `${c.dataset.label}: ${num(c.parsed.y)}` } },
      },
      scales: {
        x: { ticks: { maxTicksLimit: 10, maxRotation: 0 }, grid: { display: false }, title: { display: true, text: "Fecha y hora (Colombia)" } },
        y: { title: { display: true, text: "Consumo total" } },
      },
    },
  });
  $("status").textContent = `${nH} h de historia y ${nP} h de pronóstico, con ${d.confianza * 100}% de confianza.`;
}

// ---- Controles ----
const cont = $("horasBtns");
OPCIONES_HORAS.forEach((h) => {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = `${h} h`;
  b.setAttribute("aria-pressed", h === horas);
  b.onclick = () => {
    horas = h;
    cont.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b));
    cargar();
  };
  cont.appendChild(b);
});
$("hist").onchange = cargar;
$("conf").onchange = cargar;
$("refresh").onclick = cargar;
$("retry").onclick = cargar;
cargar();
</script>
</body>
</html>
